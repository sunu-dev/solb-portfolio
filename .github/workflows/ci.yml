name: CI

# 2026-08-18 전수 감사 후속.
# 감사 전까지 이 저장소에는 CI가 없었고(.github 부재), 4개 lint는 prebuild에만,
# 테스트 236개는 **어떤 게이트에도 배선되지 않은** 상태였다.
# §6 누출 불변식 테스트가 깨져도 배포가 나갈 수 있었다는 뜻이다.
#
# prebuild에도 npm test를 넣었지만(배포 직전 관문), CI는 그와 별개로
# **머지 전에** 실패를 보여주는 역할을 한다. 빌드까지 가지 않고 PR에서 막힌다.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # 같은 브랜치에 새 푸시가 오면 이전 실행은 취소 — 큐 낭비 방지
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 타입·게이트·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      # 게이트는 개별 스텝으로 나눈다 — 어느 규약이 깨졌는지 로그에서 바로 보이게.
      - name: 컴플라이언스 어휘 (§6)
        run: npm run lint:alerts

      - name: 한국어 UI 규약
        run: npm run lint:korean

      - name: 다크모드 토큰
        run: npm run lint:darkmode

      - name: 투어 앵커 정합
        run: npm run lint:tour-anchors

      - name: ESLint
        run: npx eslint .

      - name: 테스트
        run: npm test

  build:
    name: 프로덕션 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # **런타임 비밀 없이 빌드된다.** NEXT_PUBLIC_* 두 개만 placeholder로 준다.
      #
      # 이 두 개가 필요한 이유는 '번들 인라인' 때문이 아니다(값이 비어도 인라인은 된다).
      # `src/lib/supabase.ts`가 모듈 스코프 무가드 `createClient(url!, anonKey!)`라,
      # 값이 없으면 page data 수집 중 `supabaseKey is required`로 던진다.
      # SUPABASE_SERVICE_ROLE_KEY 같은 진짜 비밀은 요청 시점 지연 생성
      # (`requireServiceClient()`)으로 바뀌어 빌드에 불필요해졌다.
      #
      # 회귀 감지 범위(정확히): 이 잡은 **`!` 단언형** 모듈 스코프 생성만 잡는다.
      # `url && key ? createClient(...) : null` 가드형은 비밀 없이도 통과하므로 못 잡는다
      # (저장소에 13곳 실재). 그쪽 회귀는 lint 룰로 잡아야 한다 — TODO 등재.
      #
      # `npx next build`를 직접 부른다. `npm run build`는 package.json의 prebuild
      # (lint 4종 + npm test)를 다시 돌려 verify 잡과 완전 중복되고, 무엇보다
      # 린트·테스트 실패가 이 스텝을 빨갛게 만들어 '비밀 회귀' 신호를 흐린다.
      - name: next build (런타임 비밀 없이)
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
