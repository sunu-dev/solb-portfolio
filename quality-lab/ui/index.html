<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>주비 개선 작업실</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><a class="skip" href="#main">검사 결과로 이동</a>
<header><a class="brand" href="/">주비 <span>개선 작업실</span></a><span class="local">로컬 작업실</span></header>
<main id="main">
  <div class="intro"><div><h1>읽을 이유가 있는 설명인지.</h1><p>실제 화면에서 발견한 문제를 근거와 함께 확인해요.</p></div><button id="scan" class="primary" disabled>같은 종목 다시 검사</button></div>
  <div class="toolbar"><label for="runs">검사 기록</label><select id="runs"></select><span id="version"></span><label class="schedule"><input id="schedule" type="checkbox"> 하루 한 번 검사</label></div>
  <p id="job" role="status" aria-live="polite"></p><button id="cancel" hidden>검사 중지</button><p id="error" role="alert" hidden></p>
  <div id="attention"></div>
  <nav aria-label="검사 보기"><button data-view="cases" aria-current="page">종목별 근거</button><button data-view="backlog">개선 과제</button><button data-view="work">개선 진행</button><button data-view="candidates">개선안 검토</button><button data-view="compare">전후 비교</button><button data-view="rubric">평가 기준</button></nav>
  <div id="content" aria-live="polite"></div>
  <footer><p>점수는 전문가 또는 모델의 화면 평가예요. 실제 사용자 만족도·이해도·재방문율을 측정한 값이 아니에요.</p><p>자동 탐지는 알려진 문제를 찾습니다. 전체 사실 검증과 제품 수정·운영 배포는 별도 단계예요. 반복 검사는 이 프로세스가 켜져 있을 때만 실행돼요.</p></footer>
</main></body></html>
